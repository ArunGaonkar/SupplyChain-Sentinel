# Hand-labeled golden test cases for the pharma segment.
#
# These were written by hand-reviewing the cached raw data in data/cache/
# (both policy_raw/ and filings_raw/) BEFORE looking at what the advanced
# pipeline produced, then confirmed against the pipeline's actual output —
# not copied from data/alert_cards.json. Six are real, verifiable
# country-dependency pairs (a policy action on country X, and a company
# whose own 10-K discloses operations in X). Two are deliberate true-negative
# cases: a company whose filing language was too generic to support a real
# claim, and a company whose filing DOES name a dependency country but for
# which no matching policy event exists in this run's data pull (a known,
# documented data-coverage gap, not a pipeline failure) — see CHANGELOG.md.
#
# expect_link: true  -> the pipeline SHOULD surface this company<->country
#                        connection (recall test)
# expect_link: false -> the pipeline should NOT fabricate this connection
#                        (precision test)

cases:
  - id: eval-01
    company: AbbVie
    ticker: ABBV
    country: Ireland
    expect_link: true
    rationale: >
      Federal Register notice reduces US tariffs on EU-origin generic
      pharmaceuticals and ingredients (covering Ireland). AbbVie's FY2025
      10-K discloses manufacturing sites in Ireland (Clonshaugh, Cork,
      Sligo, Westport).

  - id: eval-02
    company: Bristol-Myers Squibb
    ticker: BMY
    country: Ireland
    expect_link: true
    rationale: >
      Same Ireland tariff notice. BMY's 10-K discloses significant
      manufacturing operations in Ireland (biologics/cell therapy).

  - id: eval-03
    company: Eli Lilly
    ticker: LLY
    country: Ireland
    expect_link: true
    rationale: >
      Same Ireland tariff notice. Lilly's 10-K discloses active
      ingredient manufacturing and finishing operations at sites in
      Ireland.

  - id: eval-04
    company: Viatris
    ticker: VTRS
    country: Ireland
    expect_link: true
    rationale: >
      Same Ireland tariff notice. Viatris's 10-K discloses manufacturing,
      packaging, warehousing and distribution activities in EU countries
      including Ireland.

  - id: eval-05
    company: Eli Lilly
    ticker: LLY
    country: Germany
    expect_link: true
    rationale: >
      Federal Register notice: USTR Section 301 investigation into
      Germany's pharmaceutical pricing practices. Lilly's 10-K discloses
      an active German manufacturing capacity investment.

  - id: eval-06
    company: AbbVie
    ticker: ABBV
    country: Germany
    expect_link: true
    rationale: >
      Same Section 301 Germany investigation. AbbVie's 10-K discloses a
      manufacturing presence in Ludwigshafen, Germany.

  - id: eval-07
    company: Merck
    ticker: MRK
    country: null
    expect_link: false
    rationale: >
      TRUE-NEGATIVE (precision test). Merck's cached 10-K excerpts around
      "tariffs" and country-name mentions were generic risk-factor
      boilerplate / incidental mentions with no stated sourcing or
      manufacturing dependency specific enough to support a real claim.
      The Filing Agent correctly extracted zero FilingMentions for MRK.
      A good pipeline should NOT invent a company<->country link here.

  - id: eval-08
    company: Eli Lilly
    ticker: LLY
    country: China
    expect_link: false
    rationale: >
      DATA-COVERAGE GAP (not a filtering failure). Lilly's own 10-K
      explicitly states "we...depend on China-based suppliers for
      portions of our supply chain" (FilingMention exists). But the
      cached policy pull has NO China-specific PolicyEvent this run: the
      actual full text of the Section 232 pharma investigation notice
      (federalregister.gov 2025-06587) is genuinely country-agnostic and
      never names China, and our search terms didn't surface a
      China-specific pharma tariff notice from Federal Register. So no
      graph link CAN exist yet, correctly. See CHANGELOG.md Phase 6 for
      why this is flagged as a real system limitation rather than papered
      over: full Federal Register notice bodies (not just title+abstract)
      would be needed to close this gap.
